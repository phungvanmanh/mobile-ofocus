# Chay thu cong: GitHub -> Actions -> "iOS IPA Build" -> Run workflow
#
# Mac dinh: signed = FALSE (khong can Apple secrets). Dung cho CI / kiem tra build.
# Dung TestFlight tren iPhone? -> KHONG can workflow signed. Chi can sua App Group tren
# developer.apple.com roi build lai ban upload TestFlight.
#
# Chi bat signed = TRUE khi da them day du Secrets ben duoi:
##   IOS_P12_BASE64                      - file .p12 (base64)
#   IOS_P12_PASSWORD                    - mat khau .p12
#   IOS_PROVISION_PROFILE_MAIN_BASE64   - profile Development/Ad Hoc cho com.example.ofocus
#   IOS_PROVISION_PROFILE_EXTENSION_BASE64 - profile cho com.example.ofocus.LiveKit-Broadcast-Extension
#   IOS_TEAM_ID                         - Team ID (10 ky tu, vi du SKMME9E2Y8)
#
# Tuy chon (tu dong dang ky App Group tren Apple Developer):
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY
#
# Profile PHAI co App Group "group.com.example.ofocus" (xem scripts/setup_apple_app_group.ps1)

name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed IPA (CAN 5 Apple secrets — bo chon neu dung TestFlight)
        type: boolean
        default: false
      register_app_group:
        description: Dang ky App Group tren Apple Developer (can API key secrets)
        type: boolean
        default: false
      release_tag:
        description: Upload len GitHub Release (de trong = chi tai artifact)
        required: false
        default: ''

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Register App Group (optional)
        if: inputs.register_app_group && inputs.signed
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          if [[ -z "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" && -z "${FASTLANE_USER:-}" ]]; then
            echo "Bo qua: chua cau hinh Apple API key / FASTLANE_USER."
            echo "Hay dang ky App Group thu cong: scripts/setup_apple_app_group.ps1"
            exit 0
          fi
          bash scripts/register_apple_app_group.sh

      - name: Check signing secrets
        if: inputs.signed
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_MAIN_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_MAIN_BASE64 }}
          IOS_PROVISION_PROFILE_EXTENSION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_EXTENSION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for key in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROVISION_PROFILE_MAIN_BASE64 IOS_PROVISION_PROFILE_EXTENSION_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Thieu GitHub Secret: ${key}"
              missing=1
            else
              echo "OK: ${key} da co"
            fi
          done
          if [[ "${missing}" -eq 1 ]]; then
            echo ""
            echo "::error::Ban chua cau hinh Apple signing secrets tren GitHub."
            echo ""
            echo "CACH 1 (de nhat — dung TestFlight):"
            echo "  Actions -> Run workflow -> BO CHON 'signed' -> Run"
            echo "  (Workflow se build unsigned de kiem tra code; cai iPhone van qua TestFlight.)"
            echo ""
            echo "CACH 2 (muon GitHub build IPA signed):"
            echo "  Them 5 secrets: IOS_TEAM_ID, IOS_P12_BASE64, IOS_P12_PASSWORD,"
            echo "  IOS_PROVISION_PROFILE_MAIN_BASE64, IOS_PROVISION_PROFILE_EXTENSION_BASE64"
            echo "  Lay tu developer.apple.com hoac export .p12 tu Mac (xem huong dan trong repo)."
            exit 1
          fi

      - name: Install code signing (signed build)
        if: inputs.signed
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_MAIN_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_MAIN_BASE64 }}
          IOS_PROVISION_PROFILE_EXTENSION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_EXTENSION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: bash scripts/github_ios_install_signing.sh

      - name: Prepare iOS build
        run: bash scripts/ios_build_prepare.sh

      - name: Build signed IPA
        if: inputs.signed
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build unsigned (CI only)
        if: ${{ !inputs.signed }}
        run: |
          echo "::warning::Unsigned build — KHONG cai duoc screen share tren iPhone that."
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA (CI only)
        if: ${{ !inputs.signed }}
        working-directory: build/ios/iphoneos
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 ofocus-unsigned.ipa Payload

      - name: Upload signed IPA artifact
        if: inputs.signed
        uses: actions/upload-artifact@v4
        with:
          name: ofocus-ios-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload unsigned IPA artifact
        if: ${{ !inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: ofocus-ios-unsigned
          path: build/ios/iphoneos/ofocus-unsigned.ipa
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.release_tag != '' && inputs.signed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: build/ios/ipa/*.ipa
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned to GitHub Release
        if: inputs.release_tag != '' && !inputs.signed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: build/ios/iphoneos/ofocus-unsigned.ipa
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
